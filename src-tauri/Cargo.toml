[package]
name = "command-center"
version = "0.3.0"
description = "A Linux control deck for repositories, configuration, backup, and recovery"
authors = ["Commander"]
edition = "2021"

[lib]
name = "command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shell-words = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
walkdir = "2"
open = "5"

libc = "0.2"
portable-pty = "0.9"
linutil_core = { git = "https://github.com/Commanderx-code/commander-toolbox.git", rev = "880b79c26bd475af018d98ae7dea5d206a0b211d" }

[dev-dependencies]
tempfile = "3"
