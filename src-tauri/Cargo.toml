[package]
name = "command-center"
version = "0.1.0"
description = "A Linux control deck for repositories, configuration, backup, and recovery"
authors = ["Commander"]
edition = "2021"

[lib]
name = "command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shell-words = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
walkdir = "2"
open = "5"
