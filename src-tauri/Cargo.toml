[package]
name = "command-center"
version = "0.7.0"
description = "A Linux control deck for repositories, configuration, backup, and recovery"
authors = ["Commander"]
license = "MIT"
edition = "2021"

[lib]
name = "command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shell-words = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
walkdir = "2"
open = "5"

libc = "0.2"
portable-pty = "0.9"
linutil_core = { git = "https://github.com/Commanderx-code/commander-toolbox.git", rev = "6a7edbf834ee60c88bd24f7c6cab853329c8f38e" }

[dev-dependencies]
tempfile = "3"
