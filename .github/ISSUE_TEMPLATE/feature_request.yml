name: ✨ Feature request
description: Suggest an improvement to a workstation workflow.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! 💡 Please check [existing issues](https://github.com/Commanderx-code/command-center/issues) first in case someone has already suggested it.
  - type: textarea
    id: problem
    attributes:
      label: 🎯 What would you like to accomplish?
      description: Describe your workflow and the problem you encounter today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed behavior
      description: Explain how the feature would work from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🧭 Alternatives and context
      description: Include workarounds, relevant tools, or mockups if helpful.
