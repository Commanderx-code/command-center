name: 🐛 Bug report
description: Report a reproducible problem with Command Center.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! 🙏

        > [!WARNING]
        > Please check [existing issues](https://github.com/Commanderx-code/command-center/issues) first, and remove credentials and personal information from logs and screenshots.
        >
        > **Found a security vulnerability?** Don't file it here. [Report it privately](https://github.com/Commanderx-code/command-center/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: 📦 App version or commit
      description: Find it under **Settings → About & updates**.
      placeholder: "0.7.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 🐧 Linux distribution and desktop environment
      placeholder: "Garuda Linux, KDE Plasma, Wayland"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 💿 Installation or run method
      options:
        - .deb package
        - .rpm package
        - Per-user source install (desktop:install)
        - Desktop development (tauri dev)
        - Browser preview (npm run dev)
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 🔁 Steps to reproduce
      description: Include the view, action, and relevant integration setup.
      placeholder: "1. Open…\n2. Choose…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 🤔 Expected and actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 📋 Relevant logs or screenshots
      description: Include only the relevant, redacted excerpt. Note any workaround you found.
