name: Bug report
description: Report a reproducible problem with Command Center.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please check existing issues first. Remove credentials and personal information from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: "0.3.2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux distribution and desktop environment
      placeholder: "Garuda Linux, KDE Plasma, Wayland"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation or run method
      options:
        - .deb package
        - .rpm package
        - Per-user source install (desktop:install)
        - Desktop development (tauri dev)
        - Browser preview (npm run dev)
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the view, action, and relevant integration setup.
      placeholder: "1. Open…\n2. Choose…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant logs or screenshots
      description: Include only the relevant, redacted excerpt. Note any workaround you found.
